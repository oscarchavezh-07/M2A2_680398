<!DOCTYPE html>

<html lang="es">
    <head>
        <meta charset="UTF-8">
        <title>Registro para un Torneo de Videojuegos</title>
    </head>
    <body>
        <hr>
        <form action="" method="post">
            <table border="1" cellpadding="7">
                <tr>
                    <td><label for="nombre">Nombre del jugador:</label></td>
                    <td>
                        <input type="text" id="nombre" name="nombre" minlength="3" maxlength="15"  required>
                    </td>
                </tr>
                <tr>
                    <td><label for="correo">Correo:</label></td>
                    <td>
                        <input type="email" id="correo" name="correo" required>
                    </td>
                </tr>
                <tr>
                    <td><label for="edad">Edad: </label></td>
                    <td>
                        <input type="number" id="edad" name="edad" min="12" max="40" required>
                    </td>
                </tr>
                <tr>
                    <td><label for="nickname">Nickname: </label></td>
                    <td>
                        <input type="text" pattern="[A-Za-z0-9]+" id="nickname" name="nickname">
                    </td>
                </tr>
                <tr>
                    <td>Categoría: </td>
                    <td>
                        <input type="radio" id="principiante" name="categoria" value="principiante" required>
                        <label for="principiante">Principiante</label>
                        <input type="radio" id="intermedio" name="categoria" value="intermedio" required>
                        <label for="intermedio">Intermedio</label>
                        <input type="radio" id="experto" name="categoria" value="experto" required>
                        <label for="experto">Experto</label>
                    </td>
                </tr>
                <tr>
                    <td>Juegos favoritos:</td>
                    <td>
                        <input type="checkbox" id="fifa" name="juegoFavorito" value="fifa">
                        <label for="fifa">FIFA</label>
                        <input type="checkbox" id="lol" name="juegoFavorito" value="lol">
                        <label for="lol">LOL</label>
                        <input type="checkbox" id="minecraft" name="juegoFavorito" value="minecraft">
                        <label for="minecraft">Minecraft</label>
                    </td>
                </tr>
                <tr>
                    <td><label for="fecha">Fecha de inscripción: </label></td>
                    <td>
                        <input type="date" id="fecha" name="fecha" min="2025-01-01">
                    </td>
                </tr>
                <tr>
                    <td style="text-align: center;" colspan="2">
                        <input type="submit" value="Enviar">
                        <input type="reset" value="Restablecer">
                    </td>
                </tr>
            </table>
        </form>
    </body>
</html>
